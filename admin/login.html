<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Staff Login | Hotel Varn Inn By Epsilon</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
    <style>
        body {
            background: radial-gradient(circle at center, #150724 0%, #090c12 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-card {
            background: var(--adm-surface);
            border: 1px solid var(--adm-border-gold);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="text-align:center;margin-bottom:2rem;">
            <div style="font-size:0.75rem;letter-spacing:0.25em;color:var(--adm-gold);text-transform:uppercase;font-weight:700;margin-bottom:0.5rem;">5-STAR LUXURY SUITES</div>
            <h1 class="font-heading" style="color:#fff;font-size:1.6rem;letter-spacing:0.05em;">HOTEL VARN INN</h1>
            <p style="color:var(--adm-gold);font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;margin-top:0.25rem;">
                BY EPSILON • ROORKEE
            </p>
            <p style="color:var(--adm-text-muted);font-size:0.85rem;margin-top:0.75rem;">
                Executive Administration & CMS Portal
            </p>
        </div>

        <div id="loginError" style="display:none;background:rgba(239, 68, 68, 0.15);border:1px solid var(--adm-danger);color:#fca5a5;padding:0.75rem 1rem;border-radius:6px;font-size:0.85rem;margin-bottom:1.5rem;text-align:center;"></div>

        <form id="adminLoginForm">
            <div class="form-group" style="margin-bottom:1.25rem;">
                <label class="form-label">Username</label>
                <input type="text" id="loginUsername" class="form-control" value="admin" required autofocus autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom:1.5rem;">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" value="admin123" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-adm-gold" style="width:100%;padding:0.85rem;font-size:0.95rem;">
                Access Control Panel
            </button>
        </form>

        <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--adm-border);text-align:center;font-size:0.8rem;color:var(--adm-text-muted);">
            <div>Default Demo Credentials: <strong style="color:var(--adm-gold);">admin</strong> / <strong style="color:var(--adm-gold);">admin123</strong></div>
            <a href="../index.html" style="color:var(--adm-text-muted);text-decoration:none;display:inline-block;margin-top:0.75rem;">&larr; Return to Guest Website</a>
        </div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        // Check if already logged in
        if (HotelStore.isAdminLoggedIn()) {
            window.location.href = 'index.html';
        }

        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');

            if (HotelStore.adminLogin(u, p)) {
                window.location.href = 'index.html';
            } else {
                err.textContent = 'Invalid credentials. Use admin / admin123';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
