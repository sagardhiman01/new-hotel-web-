<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Inquiries | Hotel Varn Inn By Epsilon</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

    <!-- Sidebar placeholder -->
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-topbar" id="adminTopbar"></header>

        <div class="admin-content">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
                <div>
                    <h2 class="font-heading" style="font-size:1.4rem;color:#fff;">Guest Inquiries & Messages</h2>
                    <p style="font-size:0.85rem;color:var(--adm-text-muted);">
                        Inquiries received via the Contact Form, Banquets & Events inquiry forms.
                    </p>
                </div>
            </div>

            <div id="messagesContainer" style="display:flex;flex-direction:column;gap:1.25rem;">
                <!-- Populated dynamically -->
            </div>

        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initAdminPage('messages', 'Guest Inquiries');
            renderMessages();
        });

        function renderMessages() {
            const messages = HotelStore.getMessages();
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            if (messages.length === 0) {
                container.innerHTML = '<div class="admin-card" style="text-align:center;color:var(--adm-text-muted);padding:3rem;">No guest inquiries received yet.</div>';
                return;
            }

            messages.forEach(m => {
                const card = document.createElement('div');
                card.className = 'admin-card';
                card.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;flex-wrap:wrap;';

                const cleanPhone = (m.phone || '').replace(/[^0-9]/g, '');

                card.innerHTML = `
                    <div style="flex:1;min-width:280px;">
                        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;flex-wrap:wrap;">
                            <strong style="color:#fff;font-size:1.05rem;">${m.name}</strong>
                            <span class="status-badge ${m.status === 'unread' ? 'badge-pending' : 'badge-confirmed'}">${m.status.toUpperCase()}</span>
                            <span style="font-size:0.8rem;color:var(--adm-text-dim);">${formatDate(m.created_at)}</span>
                        </div>
                        <div style="font-size:0.85rem;color:var(--adm-gold);margin-bottom:0.75rem;">
                            <strong>${m.subject ? `Subject: ${m.subject} • ` : ''}</strong>
                            <span>Phone: <a href="tel:${cleanPhone}" style="color:var(--adm-gold);">${m.phone || 'N/A'}</a></span> • 
                            <span>Email: <a href="mailto:${m.email || ''}" style="color:var(--adm-gold);">${m.email || 'N/A'}</a></span>
                        </div>
                        <p style="font-size:0.9rem;color:#cbd5e1;line-height:1.6;background:rgba(0,0,0,0.25);padding:1rem;border-radius:6px;border:1px solid var(--adm-border);">
                            ${m.message || ''}
                        </p>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:0.5rem;min-width:140px;">
                        ${cleanPhone ? `<a href="https://wa.me/${cleanPhone}?text=Hello%20${encodeURIComponent(m.name)},%20we%20received%20your%20inquiry%20at%20Hotel%20Varn%20Inn." target="_blank" class="btn btn-adm-gold btn-adm-sm" style="text-align:center;text-decoration:none;">WhatsApp Reply</a>` : ''}
                        <button class="btn btn-adm-secondary btn-adm-sm" onclick="toggleStatus(${m.id}, '${m.status === 'unread' ? 'read' : 'unread'}')">
                            Mark as ${m.status === 'unread' ? 'Read' : 'Unread'}
                        </button>
                        <button class="btn btn-adm-danger btn-adm-sm" onclick="deleteMsg(${m.id})">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleStatus(id, newStatus) {
            HotelStore.updateMessageStatus(id, newStatus);
            renderMessages();
            showAdminToast(`Marked as ${newStatus}`);
        }

        function deleteMsg(id) {
            if (confirm('Delete this message?')) {
                HotelStore.deleteMessage(id);
                showAdminToast('Message deleted');
                renderMessages();
            }
        }
    </script>
</body>
</html>
