<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Reservations | Hotel Varn Inn By Epsilon</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-body">

    <!-- Sidebar placeholder -->
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-topbar" id="adminTopbar"></header>

        <div class="admin-content">

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;">
                <div>
                    <h2 class="font-heading" style="font-size:1.4rem;color:#fff;">Guest Reservations & Bookings</h2>
                    <p style="font-size:0.85rem;color:var(--adm-text-muted);">
                        Manage incoming reservation inquiries, confirm bookings, or directly connect via WhatsApp.
                    </p>
                </div>
                <div style="display:flex;gap:0.5rem;" id="filterButtons">
                    <button class="btn btn-adm-gold btn-adm-sm" onclick="filterBookings('all')">All</button>
                    <button class="btn btn-adm-secondary btn-adm-sm" onclick="filterBookings('pending')">Pending</button>
                    <button class="btn btn-adm-secondary btn-adm-sm" onclick="filterBookings('confirmed')">Confirmed</button>
                    <button class="btn btn-adm-secondary btn-adm-sm" onclick="filterBookings('cancelled')">Cancelled</button>
                </div>
            </div>

            <div class="admin-card">
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Booking Ref</th>
                                <th>Guest Info</th>
                                <th>Room Reserved</th>
                                <th>Stay Dates</th>
                                <th>Special Notes</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initAdminPage('bookings', 'Guest Reservations');
            renderBookings();
        });

        function filterBookings(status) {
            currentFilter = status;
            const buttons = document.querySelectorAll('#filterButtons button');
            buttons.forEach(btn => {
                if (btn.textContent.toLowerCase() === status) {
                    btn.className = 'btn btn-adm-gold btn-adm-sm';
                } else {
                    btn.className = 'btn btn-adm-secondary btn-adm-sm';
                }
            });
            renderBookings();
        }

        function renderBookings() {
            let bookings = HotelStore.getBookings();
            if (currentFilter !== 'all') {
                bookings = bookings.filter(b => b.status === currentFilter);
            }

            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = '';

            if (bookings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--adm-text-muted);padding:2.5rem;">No ${currentFilter === 'all' ? '' : currentFilter} reservations found.</td></tr>`;
                return;
            }

            bookings.forEach(b => {
                const tr = document.createElement('tr');
                const statusBadgeClass = b.status === 'confirmed' ? 'badge-confirmed' : b.status === 'cancelled' ? 'badge-cancelled' : 'badge-pending';
                const cleanPhone = (b.guest_phone || '').replace(/[^0-9]/g, '');

                tr.innerHTML = `
                    <td>
                        <strong style="color:var(--adm-gold);font-family:monospace;font-size:0.95rem;">${b.booking_code || 'VARN-PENDING'}</strong>
                        <div style="font-size:0.75rem;color:var(--adm-text-dim);">${formatDate(b.created_at)}</div>
                    </td>
                    <td>
                        <div style="font-weight:700;color:#fff;">${b.guest_name || 'Guest'}</div>
                        <div style="font-size:0.8rem;color:var(--adm-text-muted);">${b.guest_phone || ''}</div>
                        <div style="font-size:0.75rem;color:var(--adm-text-dim);">${b.guest_email || ''}</div>
                    </td>
                    <td>
                        <div style="font-weight:600;">${b.room_title || 'Deluxe Room'}</div>
                        <div style="font-size:0.75rem;color:var(--adm-text-dim);">${b.guests_count || 2} Guests</div>
                    </td>
                    <td>
                        <div style="font-size:0.85rem;"><strong>In:</strong> ${formatDate(b.check_in)}</div>
                        <div style="font-size:0.85rem;"><strong>Out:</strong> ${formatDate(b.check_out)}</div>
                    </td>
                    <td style="max-width:200px;">
                        <div style="font-size:0.8rem;color:#cbd5e1;line-height:1.4;">${b.special_requests || '—'}</div>
                    </td>
                    <td>
                        <strong style="color:var(--adm-gold);font-size:1rem;">${formatINR(b.total_price)}</strong>
                    </td>
                    <td>
                        <select class="form-control" style="font-size:0.8rem;padding:0.35rem 0.5rem;width:125px;" onchange="updateStatus(${b.id}, this.value)">
                            <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    </td>
                    <td>
                        <div style="display:flex;gap:0.4rem;flex-direction:column;">
                            ${cleanPhone ? `<a href="https://wa.me/${cleanPhone}?text=Hello%20${encodeURIComponent(b.guest_name)},%20regarding%20your%20reservation%20at%20Hotel%20Varn%20Inn%20(Ref:%20${b.booking_code})." target="_blank" class="btn btn-adm-gold btn-adm-sm" style="text-align:center;text-decoration:none;">WhatsApp 💬</a>` : ''}
                            <button class="btn btn-adm-danger btn-adm-sm" onclick="deleteBooking(${b.id})">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStatus(id, newStatus) {
            HotelStore.updateBookingStatus(id, newStatus);
            showAdminToast(`Status changed to ${newStatus.toUpperCase()}`);
            renderBookings();
        }

        function deleteBooking(id) {
            if (confirm('Delete this booking permanently?')) {
                HotelStore.deleteBooking(id);
                showAdminToast('Booking deleted');
                renderBookings();
            }
        }
    </script>
</body>
</html>
